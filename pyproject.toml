[project]
name = "ezwav"
version = "0.1.0a1"
description = "A python package that streamlines the handling of WAV files."
authors = [
  { name="Nathaniel Wood", email="contact@nathanielgwood.com" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "scipy",
  "numpy",
  "wave",
  "matplotlib.pyplot"
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/enjiwood/ezwav"
Issues = "https://github.com/enjiwood/ezwav/issues"